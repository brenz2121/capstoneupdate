<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#155e70" />
    <title>Daftar — ToiletCare</title>
    <link rel="stylesheet" href="style.css" />
    <script src="signup.js" defer></script>
  </head>
  <body class="signup-body">
    <main class="container" aria-labelledby="signupTitle">
      <a class="brand signup-brand" href="index.html"
        ><span class="brand-mark" aria-hidden="true">✦</span> ToiletCare
        <span class="brand-tag">VR</span></a
      >
      <p class="section-kicker">MULAI LANGKAH BERSAMA</p>
      <h1 id="signupTitle">Buat akun orang tua</h1>
      <p class="muted signup-intro">
        Daftar untuk mendampingi langkah mandiri si kecil.
      </p>
      <form class="auth-form" id="signupForm">
        <div class="form-group">
          <label for="nama">Nama lengkap</label>
          <input
            type="text"
            id="nama"
            name="full_name"
            placeholder="Nama lengkap Anda"
            autocomplete="name"
            maxlength="120"
            required
          />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="username"
            maxlength="254"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Kata sandi</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Buat kata sandi"
              autocomplete="new-password"
              minlength="6"
              maxlength="72"
              aria-describedby="passwordHint"
              required
            />
            <button
              id="toggleSignupPassword"
              class="password-toggle"
              type="button"
              aria-controls="password"
              aria-label="Tampilkan kata sandi"
              aria-pressed="false"
            >
              Lihat
            </button>
          </div>
          <small id="passwordHint" class="field-hint"
            >Minimal 6 karakter.</small
          >
        </div>
        <div class="form-group">
          <label for="konfirmasi">Konfirmasi kata sandi</label>
          <input
            type="password"
            id="konfirmasi"
            name="password_confirmation"
            placeholder="Ulangi kata sandi"
            autocomplete="new-password"
            minlength="6"
            maxlength="72"
            required
          />
        </div>
        <p
          id="signupMessage"
          class="form-message"
          role="alert"
          tabindex="-1"
          hidden
        ></p>
        <button id="signupButton" type="submit" class="main-button">
          Buat akun <span aria-hidden="true">→</span>
        </button>
      </form>
      <section
        id="signupSuccess"
        class="registration-success"
        role="status"
        tabindex="-1"
        hidden
      >
        <span class="success-mark" aria-hidden="true">✓</span>
        <h2>Akun berhasil dibuat</h2>
        <p>
          Silakan masuk menggunakan email dan kata sandi yang baru Anda
          daftarkan.
        </p>
        <a href="login.html" class="main-button">Masuk ke akun</a>
      </section>
      <p id="signupLoginLink" class="login-link">
        Sudah punya akun? <a href="login.html">Masuk</a>
      </p>
    </main>
  </body>
</html>
