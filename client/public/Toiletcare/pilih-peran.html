<!doctype html>
<html lang="id" data-auth="required">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Selamat Datang - Toilet Training VR</title>

    <link rel="stylesheet" href="style.css" />
    <script src="session.js" defer></script>
  </head>

  <body>
    <main class="welcome-container">
      <!-- Label Halaman -->
      <p class="page-label">Pilih peran</p>

      <!-- Ilustrasi Utama -->
      <section class="welcome-illustration">
        <img src="images/logo-1.png" alt="Ilustrasi anak dan toilet" />
      </section>

      <!-- Judul Selamat Datang -->
      <section class="welcome-heading">
        <h1>Selamat Datang!</h1>

        <p>Yuk lengkapi profil!</p>
      </section>

      <!-- Pilihan Peran -->
      <section class="role-section">
        <h3>Saya adalah</h3>

        <!-- Peran Anak -->
        <a href="profil-anak.html" class="role-card">
          <img src="images/ikon-anak (1).jpg" alt="Ilustrasi Anak" />

          <div class="role-description">
            <h2>Anak</h2>

            <p>Saya pengguna yang akan melakukan latihan</p>
          </div>

          <span class="arrow"> › </span>
        </a>

        <!-- Peran Orang Tua -->
        <a href="profil-orangtua.html" class="role-card">
          <img src="images/ikon-ibu.jpg" alt="Ilustrasi Orang Tua" />

          <div class="role-description">
            <h2>Orang Tua</h2>

            <p>Saya orang tua / wali yang mendampingi anak</p>
          </div>

          <span class="arrow"> › </span>
        </a>
      </section>
    </main>
  </body>
</html>
