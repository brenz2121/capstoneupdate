<!doctype html>
<html lang="id" data-auth="required">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profil Anak</title>

    <link rel="stylesheet" href="style.css" />
    <script src="session.js" defer></script>
  </head>

  <body>
    <div class="page profile-page">
      <!-- HEADER -->
      <header class="profile-header">
        <a href="dashboard.html" class="back-button"> &#8592; </a>

        <h2>Profil</h2>
      </header>

      <!-- FOTO PROFIL ANAK -->
      <section class="profile-photo">
        <img
          src="images/ikon-anak%20(1).jpg"
          alt="Ilustrasi profil"
          class="parent-avatar"
        />

        <label for="photo-upload" class="camera-button"> &#128247; </label>

        <input type="file" id="photo-upload" name="photo" accept="image/*" />
      </section>

      <!-- FORM DATA ANAK -->
      <section class="profile-form-section">
        <h3>Data Anak</h3>

        <form action="#" method="post">
          <!-- NAMA -->
          <div class="form-group">
            <label for="nama"> Nama </label>

            <input
              type="text"
              id="nama"
              name="nama"
              placeholder="Masukan nama anak"
              required
            />
          </div>

          <!-- UMUR -->
          <div class="form-group">
            <label for="umur"> Umur </label>

            <input
              type="number"
              id="umur"
              name="umur"
              placeholder="Masukan umur anak"
              min="1"
              max="18"
              required
            />
          </div>

          <!-- JENIS KELAMIN -->
          <div class="form-group">
            <label for="jenis-kelamin"> Jenis Kelamin </label>

            <select id="jenis-kelamin" name="jenis_kelamin" required>
              <option value="" disabled selected>Pilih jenis kelamin</option>

              <option value="Laki-laki">Laki-laki</option>

              <option value="Perempuan">Perempuan</option>
            </select>
          </div>

          <!-- TOMBOL SIMPAN -->
          <button type="submit" class="save-button">Simpan</button>
        </form>
      </section>
    </div>
  </body>
</html>
